[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "makegis"
description = "A lightweight orchestrator for spatial databases"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christophe Thiange" }]
dependencies = [
	"duckdb",
	"psycopg[binary]",
	"pydantic",
	"python-dotenv",
	"pyyaml",
	"rich",
	"sqlglot",
]
dynamic = ["version"]

[project.scripts]
mkgs = "makegis.cli:cli"

[project.urls]
Repository = "https://github.com/cthiange/makegis"

[dependency-groups]
dev = [
    "pytest",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/makegis/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/makegis"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
